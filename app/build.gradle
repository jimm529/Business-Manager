plugins {
    id 'com.android.application'
}

// Backend address (BuildConfig.BASE_URL) comes from a Gradle property, so nothing is hardcoded in Java.
// It is the server root WITHOUT "/api": the app adds "/api/" itself (every route starts with /api).
//   Default:                 http://localhost:5000/
//     - real phone over USB: run "adb reverse tcp:5000 tcp:5000" once (re-run after replugging)
//     - emulator:            the same adb reverse command works, or use http://10.0.2.2:5000/
//   Real phone over Wi-Fi:   set marketplaceBaseUrl=http://<your PC's IPv4 address>:5000/
// Put the property in ~/.gradle/gradle.properties or pass -PmarketplaceBaseUrl=...
// In debug builds the address can also be changed on the Login screen (long-press SUPPORT or the logo).
def debugBaseUrl = (project.findProperty('marketplaceBaseUrl') ?: 'http://localhost:5000/').toString()
// ".invalid" is a reserved name that never resolves: release builds must set marketplaceReleaseBaseUrl.
def releaseBaseUrl = (project.findProperty('marketplaceReleaseBaseUrl') ?: 'https://marketplace.invalid/').toString()

android {
    namespace 'com.example.marketplace'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.marketplace'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'BASE_URL', "\"${debugBaseUrl}\""
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'BASE_URL', "\"${releaseBaseUrl}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Material Components (Material 3 theme)
    implementation 'com.google.android.material:material:1.12.0'

    // AndroidX basics
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Encrypted storage for the login token
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Images
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
