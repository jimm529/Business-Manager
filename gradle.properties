org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Backend address used by the app (BuildConfig.BASE_URL). Server root, WITHOUT "/api"; must end with "/".
# Default (debug) = http://localhost:5000/ -> use "adb reverse tcp:5000 tcp:5000" for a USB phone.
# Wi-Fi phone: override with your PC LAN IP, e.g. in ~/.gradle/gradle.properties:
#   marketplaceBaseUrl=http://192.168.1.20:5000/
# Release build address:
#   marketplaceReleaseBaseUrl=https://your-server/
