org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Backend address used by the app (BuildConfig.BASE_URL). Server root, WITHOUT "/api"; must end with "/".
# Default (debug) = http://localhost:5000/ -> use "adb reverse tcp:5000 tcp:5000" for a USB phone.
# Wi-Fi phone: override with your PC LAN IP, e.g. in ~/.gradle/gradle.properties:
#   marketplaceBaseUrl=http://192.168.1.20:5000/
# Release build address:
#   marketplaceReleaseBaseUrl=https://your-server/

# Google Sign-In: the Web application client ID of the Google Cloud project (a public identifier, not a secret).
# It must be the SAME id as GOOGLE_CLIENT_ID in the backend .env, because the backend checks the token's audience.
# The Cloud project also needs an Android OAuth client (package com.example.marketplace + the app's SHA-1).
marketplaceGoogleWebClientId=23243409847-dfou7t7du14eidrieh9lj9tha5hm2c5c.apps.googleusercontent.com
