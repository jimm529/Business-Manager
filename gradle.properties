org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Backend address used by the app (BuildConfig.BASE_URL). Must end with "/".
# Default (debug) = Android emulator reaching the PC's localhost:5000.
# Real phone: override with your PC LAN IP, e.g. in ~/.gradle/gradle.properties:
#   marketplaceBaseUrl=http://192.168.1.20:5000/api/
# Release build address:
#   marketplaceReleaseBaseUrl=https://your-server/api/
